<svg xmlns="http://www.w3.org/2000/svg" width="830" height="320" viewBox="0 0 830 320" role="img" aria-label="Sahil builds.">
<style>
  .bg{fill:#0d1017}
  .tag{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:2px;fill:#8a93a6}
  .n1{font:400 92px Georgia, 'Times New Roman', serif;fill:#f2efe8;letter-spacing:-3px}
  .n2{font:italic 400 92px Georgia, 'Times New Roman', serif;fill:#2f5bff;letter-spacing:-3px}
  .role{font:400 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#b4bccd;opacity:0;animation:role 9s infinite}
  .dot{fill:#3a4668;animation:pulse 3s ease-in-out infinite}
  .sq{fill:#2f5bff;animation:blink 1.6s steps(2,start) infinite}
  .rise{opacity:0;animation:rise .9s ease-out forwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1;fill:#2f5bff}}
  @keyframes blink{50%{opacity:.2}}
  @keyframes role{0%{opacity:0;transform:translateY(8px)}4.0%{opacity:1;transform:translateY(0)}28.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
</style>
