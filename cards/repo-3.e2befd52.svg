<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
<style>
  .tg{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:2px;fill:#4a3d08}
  .ti{font:400 34px Georgia, 'Times New Roman', serif;fill:#14161c;letter-spacing:-.5px}
  .ds{font:400 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#4a3d08}
  .lg{font:500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#4a3d08}
  .elo{font:600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1.5px;fill:#4a3d08}
  .disp{font:700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffc928;animation:blink 1.4s steps(2,start) infinite}
  .in{opacity:0;animation:in .8s ease-out forwards}
  .ring{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite;opacity:0}
  .scan{animation:scan 2.4s ease-in-out infinite alternate}
  .ln{transform-box:fill-box;transform-origin:left center;animation:type 5.5s ease-out infinite;transform:scaleX(0)}
  .cur{animation:blink 1s steps(2,start) infinite}
  .key{animation:press 4.4s infinite}
  .ring2{transform-box:fill-box;transform-origin:center;animation:breathe 3.2s ease-in-out infinite}
  .orb1{transform-origin:320px 116px;animation:spin 7s linear infinite}
  .orb2{transform-origin:320px 116px;animation:spin 4.5s linear infinite reverse}
  .sh{animation:sheen 6s ease-in-out infinite;animation-delay:2s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes ping{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1);opacity:0}}
  @keyframes scan{from{transform:translateY(0)}to{transform:translateY(112px)}}
  @keyframes type{0%{transform:scaleX(0)}18%{transform:scaleX(1)}85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  @keyframes blink{50%{opacity:.15}}
  @keyframes press{0%,86%,100%{opacity:1}91%{opacity:.3}}
  @keyframes breathe{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.06);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sheen{0%{transform:translateX(-420px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}
</style>
<clipPath id="r2k"><rect width="400" height="220" rx="18"/></clipPath>
<rect width="400" height="220" rx="18" fill="#ffc928" stroke="#ffc928" stroke-width="1.5"/>
<g clip-path="url(#r2k)"><rect class="sh" x="0" y="-20" width="70" height="260" fill="#ffffff" opacity=".07"/></g>

<rect x="246" y="40" width="140" height="156" rx="16" fill="#e0ad12"/>
<rect x="258" y="50" width="118" height="30" rx="8" fill="#14161c"/>
<text class="disp" x="368" y="72" text-anchor="end">= 42</text>
<rect class="key" x="258" y="88" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:0.00s"/><rect class="key" x="300" y="88" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:0.37s"/><rect class="key" x="342" y="88" width="34" height="25" rx="8" fill="#2f5bff" style="animation-delay:0.74s"/><rect class="key" x="258" y="119" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:1.11s"/><rect class="key" x="300" y="119" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:1.48s"/><rect class="key" x="342" y="119" width="34" height="25" rx="8" fill="#2f5bff" style="animation-delay:1.85s"/><rect class="key" x="258" y="150" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:2.22s"/><rect class="key" x="300" y="150" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:2.59s"/><rect class="key" x="342" y="150" width="34" height="25" rx="8" fill="#2f5bff" style="animation-delay:2.96s"/><rect class="key" x="258" y="181" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:3.33s"/><rect class="key" x="300" y="181" width="34" height="25" rx="8" fill="#14161c" style="animation-delay:3.70s"/><rect class="key" x="342" y="181" width="34" height="25" rx="8" fill="#2f5bff" style="animation-delay:4.07s"/>
<text class="tg in" x="28" y="40">TOOL</text>
<text class="ti in" x="28" y="86" style="animation-delay:.1s">calculator</text>
<text class="ds in" x="28" y="120" style="animation-delay:.2s">A simple command-line</text>
<text class="ds in" x="28" y="139" style="animation-delay:.28s">calculator built in Python.</text>
<circle cx="32" cy="190" r="4.5" fill="#14161c"/>
<text class="lg" x="44" y="194">Python · MIT</text>
</svg>