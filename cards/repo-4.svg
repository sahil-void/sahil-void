<circle class="ring2" cx="320" cy="116" r="34" fill="none" stroke="#6f8cff" stroke-opacity=".8" stroke-width="2.5" style="animation-delay:1s"/>
<g class="orb1"><circle cx="394" cy="116" r="6" fill="#ffc928"/></g>
