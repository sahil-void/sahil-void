<svg xmlns="http://www.w3.org/2000/svg" width="270" height="170" viewBox="0 0 270 170">
<style>
  .l{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:2px;fill:#ffffff;opacity:.85}
  .b{font:italic 400 34px Georgia, 'Times New Roman', serif;fill:#ffffff}
  .s{font:400 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ffffff;opacity:.9}
  .a{font:400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ffffff}
  .in{opacity:0;animation:in .8s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes sheen{0%{transform:translateX(-300px)}100%{transform:translateX(300px)}}
  .sh{animation:sheen 5s ease-in-out infinite;animation-delay:1s}
</style>
<clipPath id="c"><rect width="270" height="170" rx="14"/></clipPath>
<rect width="270" height="170" rx="14" fill="#ef3b2d"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="-20" width="60" height="220" fill="#ffffff" opacity=".12" transform="skewX(-20)"/></g>
<text class="l in" x="22" y="34">LIVE</text>
<text class="a in" x="236" y="36">→</text>
<text class="b in" x="22" y="92" style="animation-delay:.15s">CodeCampus</text>
<text class="s in" x="22" y="124" style="animation-delay:.3s">Online at</text>
<text class="s in" x="22" y="142" style="animation-delay:.4s">codecampus.dpdns.org</text>
</svg>