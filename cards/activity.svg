<svg xmlns="http://www.w3.org/2000/svg" width="830" height="260" viewBox="0 0 830 260">
<style>
  .lb{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:2px;fill:#6a7185}
  .big{font:italic 400 60px Georgia, 'Times New Roman', serif;fill:#14161c;opacity:0;animation:rise .9s ease-out forwards}
  .m{font:500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6a7185}
  .pk{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#2f5bff}
  .sb{font:italic 400 38px Georgia, 'Times New Roman', serif;fill:#14161c;opacity:0;animation:rise .8s ease-out forwards}
  .ss{font:400 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#4a5060}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s ease-out both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
<rect width="830" height="260" rx="18" fill="#f2efe8" stroke="#dcd7cb"/>
<text class="lb" x="40" y="38">THE LAST 12 MONTHS ON GITHUB</text>
<text class="big" x="40" y="96">29 <tspan style="font-style:italic">contributions</tspan></text>
<rect class="bar" x="44" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0s"/><text class="m" x="61" y="232" text-anchor="middle">Dec</text><rect class="bar" x="90" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.06s"/><text class="m" x="107" y="232" text-anchor="middle">Jan</text><rect class="bar" x="136" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.12s"/><text class="m" x="153" y="232" text-anchor="middle">Feb</text><rect class="bar" x="182" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.18s"/><text class="m" x="199" y="232" text-anchor="middle">Mar</text><rect class="bar" x="228" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.24s"/><text class="m" x="245" y="232" text-anchor="middle">Apr</text><rect class="bar" x="274" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.3s"/><text class="m" x="291" y="232" text-anchor="middle">May</text><rect class="bar" x="320" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.36s"/><text class="m" x="337" y="232" text-anchor="middle">Jun</text><rect class="bar" x="366" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.42s"/><text class="m" x="383" y="232" text-anchor="middle">Jul</text><rect class="bar" x="412" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.48s"/><text class="m" x="429" y="232" text-anchor="middle">Aug</text><rect class="bar" x="458" y="199" width="34" height="11" rx="3" fill="#14161c" style="animation-delay:0.54s"/><text class="m" x="475" y="232" text-anchor="middle">Sep</text><rect class="bar" x="504" y="206" width="34" height="4" rx="3" fill="#14161c" style="animation-delay:0.6s"/><text class="m" x="521" y="232" text-anchor="middle">Oct</text><rect class="bar" x="550" y="122" width="34" height="88" rx="3" fill="#2f5bff" style="animation-delay:0.6599999999999999s"/><text class="m" x="567" y="232" text-anchor="middle">Nov</text><text class="pk" x="567" y="115" text-anchor="middle">25</text>
<line x1="600" y1="28" x2="600" y2="232" stroke="#dcd7cb"/>
<text class="sb" x="620" y="70" style="animation-delay:0.1s">2 <tspan style="font-size:20px">days</tspan></text><text class="ss" x="620" y="90">current streak</text>
<text class="sb" x="620" y="136" style="animation-delay:0.25s">2 <tspan style="font-size:20px">days</tspan></text><text class="ss" x="620" y="156">longest streak</text>
<text class="sb" x="620" y="202" style="animation-delay:0.4s">5 <tspan style="font-size:20px">/ 369</tspan></text><text class="ss" x="620" y="222">days with a commit</text>
</svg>